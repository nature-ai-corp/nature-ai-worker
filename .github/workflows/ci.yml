name: CI

# Tests use a local fake model server only. No secrets are referenced, and no
# step contacts a real model provider.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned dependencies and the package
        run: |
          python -m pip install -r requirements.lock -r requirements-dev.lock
          python -m pip install --no-deps .
          python -m pip check
      - name: Launch real installed Worker on Linux
        run: python scripts/real-worker-smoke.py
      - name: Run tests
        run: python -m pytest -q

  windows-security:
    name: Windows client security (Python ${{ matrix.python }})
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.lock -r requirements-dev.lock
          python -m pip install --no-deps .
          python -m pip check
      - name: Launch real installed Nature AI Worker process
        run: python scripts/real-worker-smoke.py
      - name: Test Windows mode switching and cleanup
        run: python -m pytest -q tests/test_installation_mode.py tests/test_install_gate.py tests/test_install_audit.py tests/test_os_probes.py tests/test_windows_probes.py tests/test_windows_storage.py tests/test_windows_dpapi.py tests/test_windows_credentials.py tests/test_windows_session_recovery.py tests/test_platform_http.py tests/test_platform_contract.py tests/test_platform_operations.py tests/test_platform_progress.py tests/test_platform_client.py tests/test_platform_client_task_view.py tests/test_linux_isolation.py tests/test_platform_storage.py tests/test_platform_crypto.py tests/test_platform_runtime.py tests/test_mode_transition.py tests/test_transition_cleanup.py tests/test_platform_switch.py tests/test_release.py tests/test_upgrade_engine.py tests/test_upgrade_layout_cli.py tests/test_migrations_maintenance.py

  repo-checks:
    name: License, secret and artifact checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # --history scans every committed blob
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned dependencies (license metadata)
        run: python -m pip install -r requirements.lock -r requirements-dev.lock
      - name: Check license, NOTICE, SPDX headers, secrets, sensitive files, artifacts, dependency licenses
        run: python scripts/repo_checks.py --licenses --history

  upgrade-e2e:
    name: Real upgrades on a disposable installation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.lock -r requirements-dev.lock
      - name: Build signed test releases, install, upgrade, interrupt, recover, roll back
        run: python scripts/upgrade_e2e.py --workdir "${{ runner.temp }}/upgrade-e2e"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upgrade-e2e-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/upgrade-e2e/upgrade-e2e-report.md
            ${{ runner.temp }}/upgrade-e2e/logs/
          if-no-files-found: ignore

  docker:
    name: Docker build and runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, start and verify the Compose deployment
        run: scripts/docker-smoke.sh
