services:
  worker:
    build: .
    image: nature-ai-worker:0.1.0
    # Container user (default 1000:1000). To match your own user, run
    # `NATURE_WORKER_UID=$(id -u) NATURE_WORKER_GID=$(id -g) docker compose up -d`
    # or set both in .env. (Bash's UID is read-only, so it cannot be used here.)
    user: "${NATURE_WORKER_UID:-1000}:${NATURE_WORKER_GID:-1000}"
    ports:
      # Only reachable from this computer. Do not expose to a network without
      # adding authentication in front (see SECURITY.md).
      - "127.0.0.1:${NATURE_WORKER_PORT:-8080}:8080"
    volumes:
      - ./data:/data
      - ./workspace:/workspace
    env_file:
      - path: .env
        required: false
    environment:
      NATURE_WORKER_PORT: "8080"
    extra_hosts:
      # Lets the container reach Ollama running on the host at http://host.docker.internal:11434
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
